<main>
  <section class="hero">
    <div class="wrap" style="text-align:center">
      <p class="kicker">For guests</p>
      <h1>Welcome home</h1>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <form id="gate" class="gate">
        <p>This section is for our guests.<br>Please enter the password we gave you.</p>
        <input type="password" name="password" autocomplete="off" placeholder="Password" required>
        <button class="btn" type="submit">Enter</button>
        <p class="gate-error" hidden>Wrong password — please try again, or write to us.</p>
        <noscript><p class="gate-error">JavaScript must be enabled to access the guest section.</p></noscript>
      </form>

      <div id="guest-area" hidden></div>

      <template id="guest-template">
        <section class="room">
          <h2>Apartment guide</h2>
          <p class="lead">What's where — room by room.</p>
          <!-- TODO: add actual content of cabinets and drawers -->
          <div class="room">
            <h3>Kitchen</h3>
            <table class="table-list">
              <tr><th>Upper cabinets</th><td>Dishes, glasses, mugs — to be added</td></tr>
              <tr><th>Drawers by the counter</th><td>Cutlery, kitchen tools — to be added</td></tr>
              <tr><th>Lower cabinets</th><td>Pots, pans, appliances — to be added</td></tr>
            </table>
          </div>
          <div class="room">
            <h3>Living room</h3>
            <table class="table-list">
              <tr><th>Dresser</th><td>To be added</td></tr>
              <tr><th>Wardrobe</th><td>To be added</td></tr>
            </table>
          </div>
          <div class="room">
            <h3>Bedroom</h3>
            <table class="table-list">
              <tr><th>Wardrobe</th><td>Bedding, blankets, hangers — to be added</td></tr>
              <tr><th>Nightstands</th><td>To be added</td></tr>
            </table>
          </div>
          <div class="room">
            <h3>Bathroom and hallway</h3>
            <table class="table-list">
              <tr><th>Bathroom cabinet</th><td>Towels, hairdryer, toiletries — to be added</td></tr>
              <tr><th>Hallway</th><td>Iron, drying rack, cleaning supplies — to be added</td></tr>
            </table>
          </div>
        </section>

        <section class="room">
          <h2>Appliance instructions</h2>
          <!-- TODO: add brief instructions, or links to PDF manuals -->
          <div class="grid cols-3">
            <div class="card"><h3>Air conditioning</h3><p>Instructions to be added.</p></div>
            <div class="card"><h3>Washing machine</h3><p>Instructions to be added.</p></div>
            <div class="card"><h3>TV</h3><p>Instructions to be added.</p></div>
            <div class="card"><h3>Boiler</h3><p>Instructions to be added.</p></div>
            <div class="card"><h3>Oven and hob</h3><p>Instructions to be added.</p></div>
            <div class="card"><h3>Wi-Fi router</h3><p>Instructions to be added.</p></div>
          </div>
        </section>

        <section class="room">
          <h2>Practical information</h2>
          <div class="grid cols-2">
            <div class="card">
              <h3>Wi-Fi</h3>
              <p>Network: <em>to be added</em><br>Password: <em>to be added</em></p>
            </div>
            <div class="card">
              <h3>Arrival and departure</h3>
              <p>Apartment no. <strong>1403</strong> on the 14th floor — press 14 in the elevator.<br>
              Check-in / check-out and key handover — to be added.</p>
            </div>
            <div class="card">
              <h3>Waste</h3>
              <p>Where to take the trash — to be added.</p>
            </div>
            <div class="card">
              <h3>Important numbers</h3>
              <p>Emergency line in Georgia: <strong>112</strong><br>Our contact: <em>to be added</em></p>
            </div>
          </div>
          <p class="notice" style="margin-top:20px">House rules: the apartment is non-smoking. Further rules to be added.</p>
