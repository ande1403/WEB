<main>
  <section class="hero">
    <div class="wrap" style="text-align:center">
      <p class="kicker">სტუმრებისთვის</p>
      <h1>კეთილი იყოს თქვენი მობრძანება</h1>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <form id="gate" class="gate">
        <p>ეს განყოფილება ჩვენი სტუმრებისთვისაა.<br>შეიყვანეთ პაროლი, რომელიც ჩვენგან მიიღეთ.</p>
        <input type="password" name="password" autocomplete="off" placeholder="პაროლი" required>
        <button class="btn" type="submit">შესვლა</button>
        <p class="gate-error" hidden>პაროლი არასწორია — სცადეთ ხელახლა ან მოგვწერეთ.</p>
        <noscript><p class="gate-error">სტუმრების განყოფილებაში შესასვლელად საჭიროა ჩართული JavaScript.</p></noscript>
      </form>

      <div id="guest-area" hidden></div>

      <template id="guest-template">
        <section class="room">
          <h2>ბინის გზამკვლევი</h2>
          <p class="lead">რა სად დევს — ოთახების მიხედვით.</p>
          <div class="room">
            <h3>სამზარეულო</h3>
            <table class="table-list">
              <tr><th>ზედა კარადები</th><td>ჭურჭელი, ჭიქები — დავამატებთ</td></tr>
              <tr><th>უჯრები</th><td>დანა-ჩანგალი, სამზარეულოს ინვენტარი — დავამატებთ</td></tr>
              <tr><th>ქვედა კარადები</th><td>ქვაბები, ტაფები, ტექნიკა — დავამატებთ</td></tr>
            </table>
          </div>
          <div class="room">
            <h3>მისაღები</h3>
            <table class="table-list">
              <tr><th>კომოდი</th><td>დავამატებთ</td></tr>
              <tr><th>კარადა</th><td>დავამატებთ</td></tr>
            </table>
          </div>
          <div class="room">
            <h3>საძინებელი</h3>
            <table class="table-list">
              <tr><th>ტანსაცმლის კარადა</th><td>თეთრეული, საბნები, საკიდები — დავამატებთ</td></tr>
              <tr><th>ტუმბოები</th><td>დავამატებთ</td></tr>
            </table>
          </div>
          <div class="room">
            <h3>სააბაზანო და დერეფანი</h3>
            <table class="table-list">
              <tr><th>კარადა სააბაზანოში</th><td>პირსახოცები, ფენი — დავამატებთ</td></tr>
              <tr><th>დერეფანი</th><td>უთო, საშრობი, დასუფთავება — დავამატებთ</td></tr>
            </table>
          </div>
        </section>

        <section class="room">
          <h2>ტექნიკის ინსტრუქციები</h2>
          <div class="grid cols-3">
            <div class="card"><h3>კონდიციონერი</h3><p>ინსტრუქციას დავამატებთ.</p></div>
            <div class="card"><h3>სარეცხი მანქანა</h3><p>ინსტრუქციას დავამატებთ.</p></div>
            <div class="card"><h3>ტელევიზორი</h3><p>ინსტრუქციას დავამატებთ.</p></div>
            <div class="card"><h3>წყლის გამაცხელებელი</h3><p>ინსტრუქციას დავამატებთ.</p></div>
            <div class="card"><h3>ღუმელი და ქურა</h3><p>ინსტრუქციას დავამატებთ.</p></div>
            <div class="card"><h3>Wi-Fi როუტერი</h3><p>ინსტრუქციას დავამატებთ.</p></div>
          </div>
        </section>

        <section class="room">
          <h2>პრაქტიკული ინფორმაცია</h2>
          <div class="grid cols-2">
            <div class="card">
              <h3>Wi-Fi</h3>
              <p>ქსელი: <em>დავამატებთ</em><br>პაროლი: <em>დავამატებთ</em></p>
            </div>
            <div class="card">
              <h3>ჩამოსვლა და გამგზავრება</h3>
              <p>ბინა № <strong>1403</strong>, მე-14 სართული — ლიფტში ღილაკი 14.<br>
              Check-in / check-out და გასაღების გადაცემა — დავამატებთ.</p>
            </div>
            <div class="card">
              <h3>ნაგავი</h3>
              <p>სად გავიტანოთ ნაგავი — დავამატებთ.</p>
            </div>
            <div class="card">
              <h3>მნიშვნელოვანი ნომრები</h3>
              <p>გადაუდებელი დახმარება საქართველოში: <strong>112</strong><br>ჩვენი კონტაქტი: <em>დავამატებთ</em></p>
            </div>
          </div>
          <p class="notice" style="margin-top:20px">სახლის წესები: ბინაში მოწევა აკრძალულია. სხვა წესებს დავამატებთ.</p>
        </section>
